{% extends "base.html" %}
{% block content %}

<div class="simple-page attention-box">

  <h2>Quick check</h2>

  <p class="attention-instruction">
    Please solve the following problem to continue.
  </p>

  <div class="attention-task">
    <span class="attention-equation">
      {{ a }} + {{ b }} =
    </span>
  </div>

  <form method="post" action="/attention/{{ respondent_uuid }}">

    <input type="hidden" name="order" value="{{ order }}">

    <label for="answer" class="attention-label">
      Your answer
    </label>

    <input
      type="number"
      id="answer"
      name="answer"
      required
      autofocus
      class="attention-input"
    >

    <div class="navigation">
      <button type="submit" class="primary" data-submitting-text="Saving...">
        Continue
      </button>
    </div>

  </form>

</div>

<script>
  document.querySelector("form").addEventListener("submit", function () {
    const button = this.querySelector('button[type="submit"]');
    button.disabled = true;
    button.textContent = button.dataset.submittingText;
  });
</script>

{% endblock %}
